# Профиль сборки Swift-версии (ios/JAMbo.swiftpm) в Xcode: какие функции и выражения дольше всего
# проверяются по типам и сколько памяти берёт компилятор. Ищем, почему проект не собирается в Swift Playgrounds.
# Запуск: пуш тега profile-* (git tag profile-1 && git push origin profile-1), пуш этого файла в ветку swift
# или кнопка Run workflow (появится, когда файл будет и в ветке по умолчанию).
# Итог — во вкладке Summary запуска и в артефакте build-profile (полные логи).
name: Swift build profile

on:
  push:
    branches: [swift]
    # Задачи идут только по метке в сообщении коммита: [profile] — полный профиль, [calibrate] — калибровка.
    paths: ['.github/workflows/swift-build-profile.yml', 'ios/tools/build-profile-report.py', 'ios/tools/build-stats-report.py',
            'ios/JAMbo.swiftpm/**']
    tags: ['profile-*']
  workflow_dispatch:

permissions:
  contents: read

# Свой прогон на каждый коммит: следующий пуш не отменяет идущий замер.
concurrency:
  group: swift-build-profile-${{ github.sha }}
  cancel-in-progress: true

jobs:
  profile:
    # Пуш в ветку — только с [profile] в сообщении коммита; тег profile-* и Run workflow — всегда.
    if: ${{ github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[profile]') }}
    # Xcode 26 — компилятор той же линии, что в Playgrounds 4.7.
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios/JAMbo.swiftpm
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          [ -n "$XC" ] || XC=/Applications/Xcode.app
          sudo xcode-select -s "$XC"
          xcodebuild -version > "$RUNNER_TEMP/xcode-version.txt"
          cat "$RUNNER_TEMP/xcode-version.txt"
          swift --version
          xcodebuild -list

      - name: Memory sampler script
        run: |
          # Раз в секунду: сумма RSS всех swift-frontend (KB), наибольший процесс, число процессов.
          cat > "$RUNNER_TEMP/memwatch.sh" <<'EOF'
          #!/bin/bash
          while true; do
            ps -axo rss=,comm= | awk '/swift-frontend/ {s+=$1; n++; if ($1>m) m=$1} END {print s+0, m+0, n+0}' >> "$1"
            sleep 1
          done
          EOF
          chmod +x "$RUNNER_TEMP/memwatch.sh"

      - name: Build (Debug, one file per compiler process) with type-check timing and stats
        run: |
          # Без пакетного режима: у каждого файла свой процесс и свой JSON со статистикой (память, объём IR).
          mkdir -p "$RUNNER_TEMP/stats"
          "$RUNNER_TEMP/memwatch.sh" "$RUNNER_TEMP/mem.txt" & W=$!
          set -o pipefail
          start=$(date +%s)
          xcodebuild build \
            -scheme JAMbo \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ENABLE_BATCH_MODE=NO \
            OTHER_SWIFT_FLAGS="\$(inherited) -stats-output-dir $RUNNER_TEMP/stats -Xfrontend -debug-time-function-bodies -Xfrontend -warn-long-expression-type-checking=100" \
            2>&1 | tee "$RUNNER_TEMP/build.log" | grep -E 'error:|BUILD (SUCCEEDED|FAILED)' || true
          echo "seconds=$(( $(date +%s) - start ))" > "$RUNNER_TEMP/build-time.txt"
          kill $W || true

      - name: Build whole-module (one compiler process, closer to iPad)
        run: |
          mkdir -p "$RUNNER_TEMP/stats-wmo"
          "$RUNNER_TEMP/memwatch.sh" "$RUNNER_TEMP/mem-wmo.txt" & W=$!
          start=$(date +%s)
          xcodebuild build \
            -scheme JAMbo \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd-wmo" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_COMPILATION_MODE=wholemodule \
            OTHER_SWIFT_FLAGS="\$(inherited) -stats-output-dir $RUNNER_TEMP/stats-wmo" \
            > "$RUNNER_TEMP/build-wmo.log" 2>&1 || true
          echo $(( $(date +%s) - start )) > "$RUNNER_TEMP/wmo-time.txt"
          kill $W || true
          grep -E 'error:|BUILD (SUCCEEDED|FAILED)' "$RUNNER_TEMP/build-wmo.log" || true

      - name: Report
        if: always()
        run: |
          cat "$RUNNER_TEMP/build-time.txt" || true
          python3 ../tools/build-profile-report.py "$RUNNER_TEMP/build.log" "$RUNNER_TEMP/mem.txt" \
            "$RUNNER_TEMP/mem-wmo.txt" "$(cat "$RUNNER_TEMP/wmo-time.txt" 2>/dev/null)" > "$RUNNER_TEMP/report.md"
          python3 ../tools/build-stats-report.py "$RUNNER_TEMP/stats" "$RUNNER_TEMP/stats-wmo" > "$RUNNER_TEMP/stats.md"
          {
            echo "Xcode: $(head -1 "$RUNNER_TEMP/xcode-version.txt"); сборка по файлам: $(cat "$RUNNER_TEMP/build-time.txt" 2>/dev/null)"
            echo
            cat "$RUNNER_TEMP/report.md"
            echo
            cat "$RUNNER_TEMP/stats.md"
          } >> "$GITHUB_STEP_SUMMARY"
          # В лог задачи — целиком (артефакт из облачной сессии не скачать).
          cat "$RUNNER_TEMP/stats.md"
          head -80 "$RUNNER_TEMP/report.md"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-profile
          path: |
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/build-wmo.log
            ${{ runner.temp }}/mem.txt
            ${{ runner.temp }}/mem-wmo.txt
            ${{ runner.temp }}/report.md
            ${{ runner.temp }}/stats.md
            ${{ runner.temp }}/stats
            ${{ runner.temp }}/stats-wmo
          retention-days: 14

  # Калибровка (сравнение 27.10–1.11: 114cca4 — 1288 МБ / 1,51 млн IR, 8a12490 — 1518 / 1,93, 1f2950b — 1561 / 1,99,
  # 4b3a968 — 1571 / 2,03; цель ≤ ~1500 МБ). Память и объём кода одной сборки «весь модуль» под iPad (arm64) у версий, которые на iPad
  # собирались (114cca4 — надёжно, 1f2950b — со второго раза), и у текущей. Разница — сколько кода срезать.
  calibrate:
    if: ${{ contains(github.event.head_commit.message, '[calibrate]') }}
    runs-on: macos-26
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        ref: [HEAD]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          [ -n "$XC" ] || XC=/Applications/Xcode.app
          sudo xcode-select -s "$XC"
          xcodebuild -version > "$RUNNER_TEMP/xcode-version.txt"; cat "$RUNNER_TEMP/xcode-version.txt"
      - name: Checkout app at ${{ matrix.ref }}
        run: |
          if [ "${{ matrix.ref }}" != "HEAD" ]; then
            rm -rf ios/JAMbo.swiftpm
            git checkout ${{ matrix.ref }} -- ios/JAMbo.swiftpm
          fi
          git log -1 --format='%h %ad %s' --date=short ${{ matrix.ref }}
          find ios/JAMbo.swiftpm -name '*.swift' | xargs cat | wc -c | awk '{printf "Swift, bytes: %d\n", $1}'
      - name: Build whole-module for iOS device (arm64)
        working-directory: ios/JAMbo.swiftpm
        run: |
          mkdir -p "$RUNNER_TEMP/stats"
          # Память процесса компилятора по времени (RSS, раз в секунду): где пик — в проверке типов или в генерации кода.
          ( while true; do ps -axo rss=,etime=,comm= | awk '/swift-frontend/ {printf "%s %d\n", $2, $1/1024}'; sleep 1; done ) > "$RUNNER_TEMP/rss.txt" & W=$!
          start=$(date +%s)
          xcodebuild build \
            -scheme JAMbo \
            -configuration Debug \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_COMPILATION_MODE=wholemodule \
            OTHER_SWIFT_FLAGS="\$(inherited) -stats-output-dir $RUNNER_TEMP/stats" \
            > "$RUNNER_TEMP/build.log" 2>&1 || true
          kill $W || true
          echo "build seconds: $(( $(date +%s) - start ))"
          echo "RSS timeline (elapsed MB) of the biggest swift-frontend, every 5th sample:"
          awk '{ if ($2 > 300) print }' "$RUNNER_TEMP/rss.txt" | awk 'NR % 5 == 1' | tr '\n' ' '; echo
          grep -E 'error:|BUILD (SUCCEEDED|FAILED)' "$RUNNER_TEMP/build.log" | sort -u | head -60 || true
      - name: Result
        run: |
          python3 - "$RUNNER_TEMP/stats" "${{ matrix.ref }}" <<'EOF'
          import json, os, sys
          d, ref = sys.argv[1], sys.argv[2]
          for f in sorted(os.listdir(d)):
              if 'swift-frontend' not in f or '-o-' not in f:
                  continue
              s = json.load(open(os.path.join(d, f)))
              print('CALIBRATION %s: memory %.0f MB, IR insts %d, IR functions %d, SIL functions %d, '
                    'typecheck %.1f s, LLVM %.1f s, IRGen %.1f s' % (
                  ref, s.get('Frontend.MaxMallocUsage', 0) / 1048576, s.get('IRModule.NumIRInsts', 0),
                  s.get('IRModule.NumIRFunctions', 0), s.get('SILModule.NumSILGenFunctions', 0),
                  s.get('time.swift.Type checking and Semantic analysis.wall', 0),
                  s.get('time.swift.LLVM pipeline.wall', 0), s.get('time.swift.IRGen.wall', 0)))
              # Разбивка: счётчики памяти и самые крупные счётчики (типы, объявления, метаданные).
              for k in sorted(s):
                  if any(w in k for w in ('Bytes', 'Memory', 'Malloc', 'NumTypes', 'NumDecls', 'NumIRGlobals',
                                          'NumIRBasicBlocks', 'NumSILGenGlobalVariables', 'NumGenericSignature',
                                          'NumConformance', 'NumSubstitution', 'NumLLVMBytesOutput', 'NumASTScope')):
                      print('  %s = %s' % (k, s[k]))
              big = sorted(((v, k) for k, v in s.items() if not k.startswith('time.') and isinstance(v, (int, float))), reverse=True)
              print('  top counters: ' + ', '.join('%s=%d' % (k, v) for v, k in big[:25]))
          EOF
